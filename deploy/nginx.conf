worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
events { worker_connections 4096; }
http {
  include "../.local/nginx-1.30.5/conf/mime.types";
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  server_tokens off;
  # 应用仍把 JSON 业务写请求限制为 64KB；这里为图片上传留出 5MB 文件 + multipart 开销。
  client_max_body_size 6m;
  server {
    listen 127.0.0.1:8444 ssl;
    server_name localhost;
    ssl_certificate "../.local/localhost.crt";
    ssl_certificate_key "../.local/localhost.key";
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    error_page 413 = @too_large;
    location @too_large { default_type application/json; return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"Request exceeds 64KB","requestId":"$request_id"}'; }
    location / {
      proxy_pass https://127.0.0.1:8443;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate "../.local/localhost.crt";
      proxy_ssl_server_name on;
      proxy_ssl_name localhost;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
    }
  }
}
